[pytest]
testpaths = suites
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::SyntaxWarning
addopts = -p keelward_live.plugin -p no:deepeval -p no:randomly --timeout=90 -q
markers =
    requirement(id, en, fr, expected_en, expected_fr, severity): the requirement a test checks
    smoke: happy-path test included in the quick check
    deep: extra test run only in the consultant-led deeper demo
    one_browser: run on the first browser only when several browsers are selected
